# Vamp's native apps: Vamp for Mac (the menu-bar host) and Vamp for iPad
# (full-screen Vamp over the USB cable or Wi-Fi, on an iPad or an iPhone), sharing the link code in Shared/.
# Generate the Xcode project with `xcodegen` in this folder; the generated
# Vamp.xcodeproj is committed, so building needs only Xcode.
name: Vamp
options:
  bundleIdPrefix: com.benjuodvalkis.vamp
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  VampPad:
    type: application
    platform: iOS
    sources:
      - Shared
      - Pad
    info:
      path: Pad/Info.plist
      properties:
        CFBundleDisplayName: Vamp
        # The build settings below own the version, so an upload can raise
        # the build number without editing this file.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Only Apple's own TLS (Network.framework, the Wi-Fi link since
        # ADR-504) and HMAC: exempt, so no export-compliance question per build.
        ITSAppUsesNonExemptEncryption: false
        # Over Wi-Fi (ADR-504) the app listens and advertises itself with
        # Bonjour; iPadOS asks once, after the first link by cable.
        NSLocalNetworkUsageDescription: Vamp connects to Vamp for Mac over your Wi-Fi network when the cable is out.
        NSBonjourServices:
          - _vamplink._tcp
        # A pairing QR code from Vamp for Mac opens the app (ADR-505).
        CFBundleURLTypes:
          - CFBundleURLName: com.benjuodvalkis.vamp.pair
            CFBundleURLSchemes:
              - vamp
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # An iPhone turns either way too, but not upside down (ADR-503's
        # phone layout has a portrait and a landscape arrangement).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The page is loaded from localhost, where the app's own listener
        # hands it to the Mac: plain http to loopback only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjuodvalkis.vamp.ipad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Vamp
        # iPhone and iPad since 1.1 (2026-11-04): the interface has a phone
        # layout (ADR-503). 1.0 was iPad only. An App Store app can never
        # drop a device family again once it has shipped with it.
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
  VampMac:
    type: application
    platform: macOS
    dependencies:
      # The installed app's updater (installer.plan.md Phase 4): an
      # EdDSA-signed appcast, off for a checkout, which rebuilds itself.
      # Prebuilt, from scripts/fetch-sparkle.sh (Vendor/ is gitignored).
      - framework: Vendor/Sparkle/Sparkle.framework
        embed: true
    sources:
      - Shared
      - path: Mac
        excludes:
          - "Menu/verify/**"
          - "Menu/README.md"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Vamp
        # The build settings below own the version, as for the iPad app, so
        # a notarized build can carry its own number.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # A menu-bar agent: no Dock icon, no main window.
        LSUIElement: true
        # Finding paired iPads on Wi-Fi (ADR-504): macOS asks once.
        NSLocalNetworkUsageDescription: Vamp finds Vamp for iPad on your Wi-Fi network, to connect when the cable is out.
        # REC on an input device Vamp for Mac records (ADR-533): macOS asks once.
        NSMicrophoneUsageDescription: Vamp records your audio interface's input when you press REC with an input device chosen in Settings → Capture.
        NSBonjourServices:
          - _vamplink._tcp
        # Sparkle: the feed is the latest GitHub release's appcast (the repo
        # is public; no site needed), signed with this key's private half,
        # kept in the release Mac's keychain (`generate_keys`).
        SUFeedURL: https://github.com/ben-juodvalkis/vamp/releases/latest/download/appcast.xml
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjuodvalkis.vamp.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Vamp
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: "8"
        SPARKLE_PUBLIC_KEY: ""
        # Run locally, unsandboxed: it opens usbmuxd's socket and reads the
        # repo's config, neither of which a sandboxed app may.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  VampLinkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Shared
      - Mac/UsbMux.swift
      - Mac/LinkClient.swift
      - Mac/SupervisorRules.swift
      - Mac/PairedIPads.swift
      - Mac/VampLog.swift
      - Mac/VampPaths.swift
      - Mac/FirstLaunch.swift
      - Mac/InputRecorder.swift
      - Mac/Menu/OSCEnvelope.swift
      - Mac/Menu/Wire.swift
      - Tests
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VampPad:
    build:
      targets:
        VampPad: all
  VampMac:
    build:
      targets:
        VampMac: all
  VampLinkTests:
    build:
      targets:
        VampLinkTests: [test]
    test:
      targets: [VampLinkTests]

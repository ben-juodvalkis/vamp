# Vamp's native apps: Vamp for Mac (the menu-bar host) and Vamp for iPad
# (full-screen Vamp over the USB cable), sharing the link code in Shared/.
# Generate the Xcode project with `xcodegen` in this folder; the generated
# Vamp.xcodeproj is committed, so building needs only Xcode.
name: Vamp
options:
  bundleIdPrefix: com.benjuodvalkis.vamp
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  VampLinkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Shared
      - Mac/UsbMux.swift
      - Mac/LinkClient.swift
      - Tests
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VampLinkTests:
    build:
      targets:
        VampLinkTests: [test]
    test:
      targets: [VampLinkTests]
